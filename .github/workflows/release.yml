name: Draft release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build the notes and report what would happen, without tagging or releasing.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  build:
    # head.repo.full_name is a security control, not a tidiness check: a fork can
    # also name its branch dev. Do not remove it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      since: ${{ steps.version.outputs.since }}
      sha: ${{ steps.version.outputs.sha }}
      until: ${{ steps.version.outputs.until }}
    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Resolve and reserve the release version
        id: version
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version manifest.json)

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::manifest.json version '$version' is not exact x.y.z SemVer."
            exit 1
          fi

          # A tag on this very commit means an earlier attempt got as far as tagging,
          # so this is a retry. A tag anywhere else means a missing version bump.
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            tagged=$(git rev-list -n 1 "refs/tags/$version")
            if [[ "$tagged" != "$MERGE_SHA" ]]; then
              echo "::error::Tag $version already exists at $tagged. Promotions must carry a version bump."
              exit 1
            fi
            echo "Tag $version already points at this commit; continuing as a retry."
          fi

          # The window starts at the previous release tag rather than the previous
          # published release: releases/latest hides prereleases and drafts, so an
          # unpublished or 0.x draft would silently reopen the window. HEAD^ skips a
          # tag this run already created on a retry.
          previous=$(git describe --tags --abbrev=0 --match '*.*.*' "$MERGE_SHA^" 2>/dev/null || true)

          if [[ -n "$previous" ]]; then
            since=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$previous")
            echo "Previous release tag $previous at $since."
          else
            since=""
            echo "No previous release tag; the notes will cover every merged pull request."
          fi

          # A manual run has no merged_at, so the window closes at the commit itself.
          until=${MERGED_AT:-$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$MERGE_SHA")}

          {
            echo "version=$version"
            echo "since=$since"
            echo "sha=$MERGE_SHA"
            echo "until=$until"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run check
      - run: shasum -a 256 main.js manifest.json styles.css > SHA256SUMS.txt

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Store inspected release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            main.js
            manifest.json
            styles.css
            SHA256SUMS.txt
          retention-days: 7

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download inspected release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.version }}

      # The release tags ruleset blocks creation, and a user-owned repository cannot
      # grant the GitHub Actions app a bypass. This step alone runs as the owner, who
      # does hold a bypass; every other step keeps the default token.
      - name: Tag the promoted commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          MERGE_SHA: ${{ needs.build.outputs.sha }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${DRY_RUN:-}" == "true" ]]; then
            echo "Dry run: would tag $VERSION at $MERGE_SHA."
            exit 0
          fi

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::RELEASE_TOKEN is not set. Create a fine-grained token with Contents: Read and write on this repository and store it as the RELEASE_TOKEN secret. See CONTRIBUTING.md."
            exit 1
          fi

          # Idempotent, so that a failure in a later step can be retried by re-running
          # the job. Without this, re-tagging returns 422 and the release strands
          # until someone deletes the tag by hand.
          # gh prints the error body on stdout, so a 404 has to clear the capture
          # rather than land in it.
          existing=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha 2>/dev/null) || existing=""

          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$MERGE_SHA" ]]; then
              echo "::error::Tag $VERSION already points at $existing, not at the promoted commit $MERGE_SHA."
              exit 1
            fi
            echo "Tag $VERSION already points at the promoted commit; nothing to do."
            exit 0
          fi

          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$VERSION" \
            -f sha="$MERGE_SHA"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          MERGE_SHA: ${{ needs.build.outputs.sha }}
          SINCE: ${{ needs.build.outputs.since }}
          UNTIL: ${{ needs.build.outputs.until }}
          PROMOTION: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ inputs.dry-run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          # A release lands on main as a single promotion, whose commit subject cannot
          # describe the release; the dev pull requests it carries can.
          # Bounded at both ends: an empty SINCE covers everything, and UNTIL excludes
          # work merged into dev after the promotion, which this release does not carry.
          {
            echo "## Changes"
            echo
            gh api --paginate \
              "repos/$GH_REPO/pulls?base=dev&state=closed&sort=updated&direction=desc&per_page=100" \
              --jq ".[] | select(.merged_at != null and .merged_at > \"$SINCE\" and .merged_at <= \"$UNTIL\") | \"- \(.title) (#\(.number))\""
            echo
            echo "## Automated evidence"
            echo
            echo "- Tag: \`$VERSION\`"
            echo "- Commit: \`$MERGE_SHA\`"
            if [[ -n "$PROMOTION" ]]; then echo "- Promotion: #$PROMOTION"; fi
            echo "- CI run: $RUN_URL"
            echo "- Package, root lockfile, manifest, and versions mapping parity: PASS"
            echo "- Release asset contract: PASS"
            echo
            echo "## Manual release gate"
            echo
            echo "- [ ] Install these three draft assets in a clean vault."
            echo "- [ ] Link the completed compatibility matrix."
            echo "- [ ] Record actual-mobile PASS or an explicit GAP with reason."
            echo "- [ ] Record known incompatibilities or state that none were observed."
            echo "- [ ] Confirm prerelease for 0.x or stable for 1.0.0."
            echo "- [ ] For beta, append the BRAT result after publication."
            echo
            echo "Publish only after every applicable pre-publication item is complete."
            echo
            echo "## SHA-256"
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } > release-notes.md

          if [[ "${DRY_RUN:-}" == "true" ]]; then
            echo "Dry run: would draft release $VERSION with these notes."
            cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          prerelease=()
          if [[ "$VERSION" == 0.* ]]; then
            prerelease=(--prerelease)
          fi

          existing=$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null) || existing=""

          if [[ "$existing" == "false" ]]; then
            echo "::error::Release $VERSION is already published and cannot be replaced."
            exit 1
          fi

          if [[ "$existing" == "true" ]]; then
            gh release edit "$VERSION" \
              --draft \
              "${prerelease[@]}" \
              --title "$VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$VERSION" \
              --draft \
              "${prerelease[@]}" \
              --title "$VERSION" \
              --notes-file release-notes.md
          fi

          gh release upload "$VERSION" main.js manifest.json styles.css --clobber
