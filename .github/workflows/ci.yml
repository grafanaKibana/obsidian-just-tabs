name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Store release-shaped build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabsdown-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 7

  policy:
    name: policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch source, issue link, and version bump
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != "dev" ]]; then
              echo "::error::Only dev may be promoted to main. This pull request is from '$HEAD_REF'."
              exit 1
            fi

            version=$(
              gh api "repos/$GH_REPO/contents/manifest.json?ref=$HEAD_SHA" --jq .content |
                base64 -d |
                jq -r .version
            )

            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::manifest.json version '$version' is not exact x.y.z SemVer."
              exit 1
            fi

            status=$(gh api "repos/$GH_REPO/git/ref/tags/$version" --silent --include 2>/dev/null | head -1 || true)
            case "$status" in
              *" 404"*)
                echo "Version $version is not yet tagged."
                ;;
              *" 200"*)
                echo "::error::Version $version is already tagged. Run 'npm run version -- <x.y.z>' before promoting."
                exit 1
                ;;
              *)
                echo "::error::Could not determine whether tag $version exists: ${status:-no response}"
                exit 1
                ;;
            esac

            exit 0
          fi

          body=$(printf '%s' "$PR_BODY" | tr '[:upper:]' '[:lower:]')

          if [[ ! "$body" =~ (close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#([0-9]+) ]]; then
            echo "::error::Link an issue in the pull request body, for example 'Closes #17'."
            exit 1
          fi

          issue="${BASH_REMATCH[3]}"

          if [[ "$HEAD_REF" == feature/* ]]; then
            if [[ ! "$HEAD_REF" =~ ^feature/([0-9]+)-[a-z0-9-]+$ ]]; then
              echo "::error::Feature branches must be named feature/<issue>-<slug>. Got '$HEAD_REF'."
              exit 1
            fi

            if [[ "${BASH_REMATCH[1]}" != "$issue" ]]; then
              echo "::error::Branch '$HEAD_REF' and the linked issue #$issue disagree."
              exit 1
            fi
          fi

          echo "Policy satisfied for '$HEAD_REF' into '$BASE_REF' (issue #$issue)."
